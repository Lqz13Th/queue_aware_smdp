[package]
name = "queue_aware_smdp"
version = "0.1.2"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
description = "Controlled execution probes and immutable telemetry for Queue-Aware SMDP research."
repository = "https://github.com/Lqz13Th/queue_aware_smdp"
homepage = "https://github.com/Lqz13Th/queue_aware_smdp"
documentation = "https://docs.rs/queue_aware_smdp"
keywords = ["trading", "market-making", "hyperliquid", "quant", "smdp"]
categories = ["finance", "command-line-utilities"]

[lib]
name = "queue_aware_smdp"
path = "src/lib.rs"

[[bin]]
name = "queue_aware_smdp"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
extrema_infra = { version = "0.3.13", features = ["lob_clients"] }
rand = "0.10"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
zstd = "0.13"
